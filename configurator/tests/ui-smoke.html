<!doctype html>
<!-- UI smoke test for the configurator: drives the real page inside an iframe and prints
     PASS/FAIL lines into #r. Run headless (file:// iframes need these flags):
       chrome --headless=new --allow-file-access-from-files --disable-web-security
              --user-data-dir=<tmp> --virtual-time-budget=8000 --dump-dom configurator/tests/ui-smoke.html
     CI fails if any line says FAIL or ERROR, or if the result is still "pending". -->
<meta charset="utf-8"><title>Configurator UI smoke test</title>
<html><body><pre id="r">pending</pre>
<iframe id="f" src="../index.html#shinybot" style="width:1200px;height:900px"></iframe>
<script>
const R = [];
function ok(name, cond) { R.push((cond ? 'PASS ' : 'FAIL ') + name); }
document.getElementById('f').onload = () => setTimeout(() => {
  try {
    const w = document.getElementById('f').contentWindow, d = w.document;
    const pv = () => d.getElementById('preview').textContent;
    const fire = (el, t) => el.dispatchEvent(new w.Event(t, { bubbles: true }));
    // 1. pick a mode
    const sem = [...d.querySelectorAll('.mode')].find(b => b.textContent.includes('Semilla inicial'));
    sem.click();
    ok('mode click updates JSON', /"mode": "Semilla inicial"/.test(pv()));
    ok('seed section visible', !d.querySelector('[data-section="seed"]').hidden);
    ok('missing seeds flagged', d.getElementById('status-summary').textContent.includes('error'));
    // 2. add seeds (comma separated paste)
    const si = d.getElementById('f-initialSeeds'); si.value = 'bc75, 0a16'; si.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
    ok('seeds added uppercase', /"initialSeeds": \["BC75", "0A16"\]/.test(pv()));
    // 3. natures in Spanish
    const na = d.getElementById('f-natures'); na.value = 'Modesta'; na.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
    ok('Spanish nature saved in English', /"natures": \["Modest"\]/.test(pv()));
    na.value = 'Nope'; na.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
    ok('unknown nature rejected', !/Nope/.test(pv()));
    // 4. IV min 31 for HP via quick button
    d.querySelector('.field[data-key="minIVs"] .quick .btn').click();
    ok('IV quick button', /"minIVs": \{"hp": 31\}/.test(pv()));
    // 5. after-seed mode
    const am = d.getElementById('f-afterSeedMode'); am.value = 'Regalo RNG'; fire(am, 'change');
    ok('afterSeedMode select', /"afterSeedMode": "Regalo RNG"/.test(pv()));
    ok('status ok after fixes', !d.getElementById('status-summary').textContent.includes('error'));
    // 6. switch to train bot, set EVs and species
    d.getElementById('tab-trainbot').click();
    ok('train tab renders', d.getElementById('preview-name').textContent === 'FRLG_TrainBot.json');
    const spe = d.querySelector('.field[data-key="evs"] .statrow:nth-child(6) input[type=number]');
    spe.value = '300'; fire(spe, 'input');
    ok('EV clamped to 255', /"spe": 255/.test(pv()));
    const sp = d.getElementById('f-species'); sp.value = 'geodude'; sp.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
    ok('species added', /"species": \["Geodude"\]/.test(pv()));
    ok('yield badge shown', !!d.querySelector('.field[data-key="species"] .badge'));
    ok('overlap warning', [...d.querySelectorAll('#issues li')].some(li => li.textContent.includes('Geodude')));
    // 7. route select switches heal mode
    const rf = d.getElementById('f-routeFile'); rf.value = 'FRLG_TrainRoute_Tower.txt'; fire(rf, 'change');
    ok('tower route sets tile', /"healMode": "tile"/.test(pv()));
    // 8. notify generate
    [...d.querySelectorAll('.field[data-key="notify"] button')].find(b => b.textContent.includes('Generar')).click();
    ok('ntfy topic generated', /"notify": \{"ntfy": "frlg-[a-z0-9]{14}"\}/.test(pv()));
    // 9. skins switch
    const ss = d.getElementById('skin-select'); ss.value = 'noche'; fire(ss, 'change');
    ok('skin applied', d.documentElement.dataset.skin === 'noche' && w.getComputedStyle(d.body).backgroundColor === 'rgb(15, 17, 24)');
    // 10. malicious skin rejected
    let threw = false; try { w.PT.skins.sanitize({ id: 'x', vars: { '--bg': 'red;}</style><script>' } }); } catch (e) { threw = true; }
    const s2 = w.PT.skins.sanitize({ id: 'x', vars: { '--bg': 'red;}</style>', '--accent': 'url(https://evil/x.png)', '--text': '#fff' }, sprites: { mascot: 'javascript:alert(1)' } });
    ok('skin sanitizer drops unsafe values', !s2.vars['--bg'] && !s2.vars['--accent'] && s2.vars['--text'] === '#fff' && !s2.sprites.mascot);
  } catch (e) { R.push('ERROR ' + e.message + ' ' + e.stack); }
  document.getElementById('r').textContent = R.join('\n');
}, 800);
</script></body></html>
