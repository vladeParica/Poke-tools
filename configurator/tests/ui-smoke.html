<!doctype html>
<!-- UI smoke test for the configurator: drives the real page inside an iframe and prints
     PASS/FAIL lines into #r. Run headless (file:// iframes need these flags):
       chrome --headless=new --allow-file-access-from-files --disable-web-security
              --user-data-dir=<tmp> --virtual-time-budget=8000 --dump-dom configurator/tests/ui-smoke.html
     CI fails if any line says FAIL or ERROR, or if the result is still "pending". -->
<meta charset="utf-8"><title>Configurator UI smoke test</title>
<html><body><pre id="r">pending</pre>
<iframe id="f" src="../index.html#shinybot" style="width:1366px;height:768px"></iframe>
<script>
const R = [];
function ok(name, cond) { R.push((cond ? 'PASS ' : 'FAIL ') + name); }
document.getElementById('f').onload = () => setTimeout(() => {
  try {
    const w = document.getElementById('f').contentWindow, d = w.document;
    const pv = () => d.getElementById('preview').textContent;
    const fire = (el, t) => el.dispatchEvent(new w.Event(t, { bubbles: true }));
    const enter = (el, v) => { el.value = v; el.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', bubbles: true })); };
    const nav = (id) => d.querySelector('[data-nav="' + id + '"]');
    const go = (id) => nav(id).click();
    const badge = (id) => { const b = nav(id).querySelector('.n-badge'); return b.hidden ? '' : b.textContent; };

    // Layout: the page itself must not scroll on a 1366x768 screen.
    ok('no page scroll at 1366x768', d.documentElement.scrollHeight <= w.innerHeight + 1);
    ok('one section at a time', d.querySelectorAll('.panel').length === 1);

    // 1. pick a mode: the Seeds tab appears with an error badge
    ok('seeds tab hidden for other modes', nav('seed').hidden);
    [...d.querySelectorAll('.mode')].find(b => b.textContent.includes('Semilla inicial')).click();
    ok('mode click updates JSON', /"mode": "Semilla inicial"/.test(pv()));
    ok('seeds tab shown', !nav('seed').hidden);
    ok('seeds tab has an error badge', badge('seed') === '1');
    ok('missing seeds flagged', d.getElementById('status-summary').textContent.includes('error'));
    // 2. clicking the issue jumps to its section
    [...d.querySelectorAll('#issues button')].find(b => b.textContent.includes('semilla')).click();
    ok('issue click opens its section', nav('seed').getAttribute('aria-selected') === 'true' && !!d.getElementById('f-initialSeeds'));
    enter(d.getElementById('f-initialSeeds'), 'bc75, 0a16');
    ok('seeds added uppercase', /"initialSeeds": \["BC75", "0A16"\]/.test(pv()));
    ok('error badge becomes a warning (afterSeedMode still empty)', nav('seed').querySelector('.n-badge').className.includes('warn'));
    const am = d.getElementById('f-afterSeedMode'); am.value = 'Regalo RNG'; fire(am, 'change');
    ok('afterSeedMode select', /"afterSeedMode": "Regalo RNG"/.test(pv()));
    ok('badge cleared once complete', badge('seed') === '');
    // 3. natures in Spanish (Qué buscar tab)
    go('target');
    const na = d.getElementById('f-natures');
    enter(na, 'Modesta');
    ok('Spanish nature saved in English', /"natures": \["Modest"\]/.test(pv()));
    enter(d.getElementById('f-natures'), 'Nope');
    ok('unknown nature rejected', !/Nope/.test(pv()));
    // 4. Next button goes to the IVs tab; IV quick button
    [...d.querySelectorAll('.panel footer .btn')].find(b => b.textContent.includes('Siguiente')).click();
    ok('next button moves to IVs', nav('ivs').getAttribute('aria-selected') === 'true');
    d.querySelector('.field[data-key="minIVs"] .quick .btn').click();
    ok('IV quick button', /"minIVs": \{"hp": 31\}/.test(pv()));
    ok('status ok after fixes', !d.getElementById('status-summary').textContent.includes('error'));
    // 5. side panel tabs
    d.getElementById('side-json').click();
    ok('JSON tab shows preview', !d.getElementById('panel-json').hidden && d.getElementById('panel-status').hidden);
    d.getElementById('side-status').click();

    // 6. Train Bot: EVs, species, route, notify
    d.getElementById('tab-trainbot').click();
    ok('train tab renders', d.getElementById('preview-name').textContent === 'FRLG_TrainBot.json');
    const spe = d.querySelector('.field[data-key="evs"] .statrow:nth-child(6) input[type=number]');
    spe.value = '300'; fire(spe, 'input');
    ok('EV clamped to 255', /"spe": 255/.test(pv()));
    go('foes');
    enter(d.getElementById('f-species'), 'geodude');
    ok('species added', /"species": \["Geodude"\]/.test(pv()));
    ok('yield badge shown', !!d.querySelector('.field[data-key="species"] .badge'));
    ok('overlap warning', [...d.querySelectorAll('#issues li')].some(li => li.textContent.includes('Geodude')));
    ok('warning badge on Rivales tab', badge('foes') !== '');
    go('route');
    const rf = d.getElementById('f-routeFile'); rf.value = 'FRLG_TrainRoute_Tower.txt'; fire(rf, 'change');
    ok('tower route sets tile', /"healMode": "tile"/.test(pv()));
    go('notify');
    [...d.querySelectorAll('.field[data-key="notify"] button')].find(b => b.textContent.includes('Generar')).click();
    ok('ntfy topic generated', /"notify": \{"ntfy": "frlg-[a-z0-9]{14}"\}/.test(pv()));
    ok('section remembered per bot', (d.getElementById('tab-shinybot').click(), nav('ivs').getAttribute('aria-selected') === 'true'));

    // 7. Farm Bot: mode cards decide which tabs exist
    d.getElementById('tab-farmbot').click();
    ok('farm tab renders', d.getElementById('preview-name').textContent === 'FRLG_FarmBot.json');
    ok('farm: 4 mode cards', d.querySelectorAll('.mode').length === 4);
    [...d.querySelectorAll('.mode')].find(b => b.textContent.includes('Robar')).click();
    ok('farm: robar mode saved', /"mode": "robar"/.test(pv()));
    ok('farm: no foes tab in robar', nav('foes').hidden);
    go('goal');
    enter(d.getElementById('f-wantedItems'), 'big mushroom');
    ok('farm: wanted item added', /"wantedItems": \["Big Mushroom"\]/.test(pv()));
    ok('farm: money target hidden in robar', d.querySelector('.field[data-key="moneyTarget"]').hidden);
    d.getElementById('tab-shinybot').click();

    // 8. skins
    const ss = d.getElementById('skin-select'); ss.value = 'noche'; fire(ss, 'change');
    ok('skin applied', d.documentElement.dataset.skin === 'noche' && w.getComputedStyle(d.body).backgroundColor === 'rgb(15, 17, 24)');
    const s2 = w.PT.skins.sanitize({ id: 'x', vars: { '--bg': 'red;}</style>', '--accent': 'url(https://evil/x.png)', '--text': '#fff' }, sprites: { mascot: 'javascript:alert(1)' } });
    ok('skin sanitizer drops unsafe values', !s2.vars['--bg'] && !s2.vars['--accent'] && s2.vars['--text'] === '#fff' && !s2.sprites.mascot);
  } catch (e) { R.push('ERROR ' + e.message + ' ' + e.stack); }
  document.getElementById('r').textContent = R.join('\n');
}, 800);
</script></body></html>
