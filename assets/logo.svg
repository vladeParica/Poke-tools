<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t">
  <title id="t">Poke-tools logo: a Poké Ball-shaped bot with a shiny sparkle</title>
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5A3C"/>
      <stop offset="1" stop-color="#D62E10"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE1EA"/>
    </linearGradient>
    <radialGradient id="led" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#E9FFFF"/>
      <stop offset="0.55" stop-color="#5CE1E6"/>
      <stop offset="1" stop-color="#1FA5B8"/>
    </radialGradient>
    <clipPath id="ball"><circle cx="128" cy="140" r="96"/></clipPath>
  </defs>

  <!-- antenna -->
  <line x1="128" y1="44" x2="128" y2="18" stroke="#1F1F2E" stroke-width="10" stroke-linecap="round"/>
  <line x1="128" y1="44" x2="128" y2="20" stroke="#6B7390" stroke-width="4" stroke-linecap="round"/>
  <circle cx="128" cy="16" r="11" fill="#FFCB05" stroke="#1F1F2E" stroke-width="6"/>

  <!-- ball body -->
  <g clip-path="url(#ball)">
    <rect x="32" y="44" width="192" height="96" fill="url(#red)"/>
    <rect x="32" y="140" width="192" height="96" fill="url(#white)"/>
    <!-- gloss -->
    <ellipse cx="92" cy="78" rx="34" ry="16" fill="#FFFFFF" opacity="0.28" transform="rotate(-25 92 78)"/>
    <!-- center band -->
    <rect x="32" y="131" width="192" height="18" fill="#1F1F2E"/>
  </g>
  <circle cx="128" cy="140" r="101" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="128" cy="140" r="96" fill="none" stroke="#1F1F2E" stroke-width="10"/>

  <!-- visor eyes -->
  <rect x="78" y="88" width="34" height="22" rx="11" fill="#1F1F2E"/>
  <rect x="144" y="88" width="34" height="22" rx="11" fill="#1F1F2E"/>
  <rect x="84" y="93" width="22" height="12" rx="6" fill="url(#led)"/>
  <rect x="150" y="93" width="22" height="12" rx="6" fill="url(#led)"/>

  <!-- center button / core -->
  <circle cx="128" cy="140" r="30" fill="#1F1F2E"/>
  <circle cx="128" cy="140" r="21" fill="#FFFFFF"/>
  <circle cx="128" cy="140" r="12" fill="url(#led)"/>

  <!-- circuit lines on the white half -->
  <g stroke="#9AA3B5" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M86 178 h22 v18"/>
    <path d="M170 178 h-22 v18"/>
  </g>
  <circle cx="108" cy="200" r="5" fill="#9AA3B5"/>
  <circle cx="148" cy="200" r="5" fill="#9AA3B5"/>

  <!-- shiny sparkle -->
  <path d="M212 40 L219 58 L237 65 L219 72 L212 90 L205 72 L187 65 L205 58 Z" fill="#FFCB05" stroke="#1F1F2E" stroke-width="5" stroke-linejoin="round"/>
  <path d="M238 100 L241 108 L249 111 L241 114 L238 122 L235 114 L227 111 L235 108 Z" fill="#FFCB05" stroke="#1F1F2E" stroke-width="3" stroke-linejoin="round"/>
</svg>
