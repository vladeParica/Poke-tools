name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Generados al día
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerar los bots desde src/
        run: |
          python shinybot/build.py
          python trainbot/build.py
      - name: Comprobar que no cambió nada
        run: |
          if ! git diff --exit-code -- shinybot/FRLG_ShinyBot.lua trainbot/FRLG_TrainBot.lua; then
            echo "::error::Los .lua generados no coinciden con src/. Corre build.py y haz commit."
            exit 1
          fi

  shinybot:
    name: Simulador Shiny Bot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Modos a ciegas (se esperan 8 PAUSED)
        working-directory: shinybot/tests
        run: |
          python run_test.py | tee out.txt
          n=$(grep -c "PAUSED'" out.txt || true)
          if [ "$n" -lt 8 ]; then echo "::error::Se esperaban 8 escenarios en PAUSED y hubo $n"; exit 1; fi
      - name: Modos RNG y configuración
        working-directory: shinybot/tests
        run: |
          python run_rng.py
          python run_wild.py
          python run_far.py
          python run_cfg.py

  trainbot:
    name: Simulador Train Bot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Escenarios
        run: |
          python trainbot/tests/run_train.py
          python trainbot/tests/run_learn.py
          python trainbot/tests/run_want.py
