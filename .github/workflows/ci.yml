name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:   # the release workflow runs the full CI before publishing

permissions:
  contents: read

jobs:
  build:
    name: Generated files up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Rebuild the bots from src/
        run: |
          python shinybot/build.py
          python trainbot/build.py
          python farmbot/build.py
      - name: Check nothing changed
        run: |
          if ! git diff --exit-code -- shinybot/FRLG_ShinyBot.lua trainbot/FRLG_TrainBot.lua farmbot/FRLG_FarmBot.lua; then
            echo "::error::The generated .lua files do not match src/. Run build.py and commit."
            exit 1
          fi
      - name: Release zips build (dry run)
        run: |
          for b in shinybot trainbot farmbot; do python tools/package.py "$b" --out dist; done

  shinybot:
    name: Shiny Bot simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Blind modes (8 PAUSED expected)
        working-directory: shinybot/tests
        run: |
          python run_test.py | tee out.txt
          n=$(grep -c "PAUSED'" out.txt || true)
          if [ "$n" -lt 8 ]; then echo "::error::Expected 8 scenarios in PAUSED, got $n"; exit 1; fi
      - name: RNG modes and configuration
        working-directory: shinybot/tests
        run: |
          python run_rng.py
          python run_wild.py
          python run_far.py
          python run_cfg.py

  trainbot:
    name: Train Bot simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Scenarios
        run: |
          python trainbot/tests/run_train.py
          python trainbot/tests/run_learn.py
          python trainbot/tests/run_want.py

  farmbot:
    name: Farm Bot simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Scenarios (every mode, menus, edge cases, shipped configs)
        run: python farmbot/tests/run_farm.py

  configurator:
    name: Configurator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Data generated from the bots is up to date
        run: |
          python configurator/tools/build_data.py
          if ! git diff --exit-code -- configurator/js/data.js; then
            echo "::error::configurator/js/data.js is stale. Run configurator/tools/build_data.py and commit."
            exit 1
          fi
      - name: Unit tests
        run: node --test configurator/tests/core.test.js
      - name: The real bots accept the exported configs
        run: python configurator/tests/test_bots_accept.py
      - name: UI smoke test (headless Chrome)
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --allow-file-access-from-files \
            --disable-web-security --user-data-dir="$RUNNER_TEMP/chrome" --virtual-time-budget=8000 \
            --dump-dom "file://$PWD/configurator/tests/ui-smoke.html" > ui.html
          sed -n '/<pre id="r">/,/<\/pre>/p' ui.html > result.txt
          cat result.txt
          if ! grep -q "PASS" result.txt || grep -qE "FAIL|ERROR|pending" result.txt; then
            echo "::error::Configurator UI smoke test failed"; exit 1
          fi
