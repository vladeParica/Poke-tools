name: Feature request
description: A new mode, option or bot
labels: [enhancement]
body:
  - type: dropdown
    id: bot
    attributes:
      label: Where does it fit?
      description: The Shiny Bot only searches; anything else goes in a separate bot (ADR-0003).
      options: [Shiny Bot, Train Bot, New bot, tools/rng, Documentation]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How do you picture it?
      description: JSON options, keys, what the bot would do step by step.
  - type: textarea
    id: edge
    attributes:
      label: Edge cases you can think of
