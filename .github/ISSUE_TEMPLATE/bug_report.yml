name: Bug report
description: The bot does something it shouldn't, or stops for no reason
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Don't paste your Discord webhook or ntfy topic**, and don't
        attach ROMs or save files.
  - type: dropdown
    id: bot
    attributes:
      label: Bot
      options: [Shiny Bot, Train Bot, tools/rng]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Bot version
      description: The first line of the Lua console (e.g. "FRLG Train Bot v1.10")
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game and language
      description: The "Juego:" line of the console (e.g. "FireRed USA v1.0")
    validations:
      required: true
  - type: input
    id: mode
    attributes:
      label: Mode (Shiny Bot) or state (Train Bot)
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: config
    attributes:
      label: Your JSON (without "notify")
      render: jsonc
  - type: textarea
    id: log
    attributes:
      label: Last lines of the log and the console
      render: text
